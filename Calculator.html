<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }

    .calculator {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      width: 300px;
      padding: 20px;
    }

    .display {
      width: 100%;
      height: 50px;
      margin-bottom: 20px;
      padding: 10px;
      font-size: 1.5rem;
      text-align: right;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #f9f9f9;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .buttons button {
      font-size: 1.2rem;
      padding: 15px;
      border: none;
      border-radius: 5px;
      background: #007BFF;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .buttons button:hover {
      background: #0056b3;
    }

    .buttons .operator {
      background: #ff6f61;
    }

    .buttons .operator:hover {
      background: #e05350;
    }

    .buttons .clear {
      background: #dc3545;
    }

    .buttons .clear:hover {
      background: #a71d2a;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input type="text" class="display" id="display" disabled>
    <div class="buttons">
      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('/')">/</button>
      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('*')">*</button>
      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button class="operator" onclick="appendValue('-')">-</button>
      <button onclick="appendValue('0')">0</button>
      <button onclick="appendValue('.')">.</button>
      <button class="clear" onclick="clearDisplay()">C</button>
      <button class="operator" onclick="appendValue('+')">+</button>
      <button class="operator" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendValue(value) {
      display.value += value;
    }

    function clearDisplay() {
      display.value = '';
    }

    function calculate() {
      try {
        // Parse and evaluate the expression manually
        const result = evaluateExpression(display.value);
        display.value = result;
      } catch (error) {
        display.value = "Error";
      }
    }

    function evaluateExpression(expression) {
      // Helper function to evaluate mathematical expressions manually
      const tokens = expression.match(/(\d+\.?\d*|[-+*/])/g); // Tokenize the input
      if (!tokens) throw new Error("Invalid Expression");

      const numbers = [];
      const operators = [];

      const precedence = { '+': 1, '-': 1, '*': 2, '/': 2 };

      function applyOperator() {
        const b = numbers.pop();
        const a = numbers.pop();
        const op = operators.pop();
        if (op === '+') numbers.push(a + b);
        else if (op === '-') numbers.push(a - b);
        else if (op === '*') numbers.push(a * b);
        else if (op === '/') {
          if (b === 0) throw new Error("Division by Zero");
          numbers.push(a / b);
        }
      }

      for (const token of tokens) {
        if (!isNaN(token)) {
          numbers.push(parseFloat(token));
        } else if (token in precedence) {
          while (
            operators.length &&
            precedence[operators[operators.length - 1]] >= precedence[token]
          ) {
            applyOperator();
          }
          operators.push(token);
        } else {
          throw new Error("Invalid Token");
        }
      }

      while (operators.length) {
        applyOperator();
      }

      return numbers[0];
    }
  </script>
</body>
</html>
